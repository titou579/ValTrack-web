<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fil d'Actualités</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f4f6f8; color: #333; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 20px; color: #111; }

    /* Formulaire */
    .form-card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 30px; }
    .form-card h2 { margin-bottom: 15px; font-size: 1.2rem; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
    .form-group textarea { resize: vertical; height: 100px; }
    button { background: #0066cc; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    button:hover { background: #0052a3; }

    /* Liste des actualités */
    .actu-card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; overflow: hidden; }
    .actu-card img { width: 100%; max-height: 350px; object-fit: cover; }
    .actu-body { padding: 20px; }
    .actu-body h3 { margin-bottom: 10px; color: #222; }
    .actu-body p { line-height: 1.6; color: #555; white-space: pre-line; }
    .actu-date { font-size: 0.85rem; color: #888; margin-top: 10px; }
    .btn-delete { background: #dc3545; margin-top: 15px; padding: 6px 12px; font-size: 0.85rem; }
    .btn-delete:hover { background: #bd2130; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Fil d'Actualités</h1>

    <!-- Formulaire d'ajout -->
    <div class="form-card">
      <h2>Publier un article</h2>
      <form id="actuForm">
        <div class="form-group">
          <label for="title">Titre</label>
          <input type="text" id="title" required>
        </div>
        <div class="form-group">
          <label for="content">Contenu</label>
          <textarea id="content" required></textarea>
        </div>
        <div class="form-group">
          <label for="image">Image (optionnel)</label>
          <input type="file" id="image" accept="image/*">
        </div>
        <button type="submit">Publier</button>
      </form>
    </div>

    <!-- Conteneur des actualités -->
    <div id="actuFeed"></div>
  </div>

  <script>
    const actuForm = document.getElementById('actuForm');
    const actuFeed = document.getElementById('actuFeed');

    // Charger les actualités au démarrage
    async function loadArticles() {
      try {
        const res = await fetch('/api/actu');
        const articles = await res.json();
        
        actuFeed.innerHTML = articles.map(art => `
          <div class="actu-card">
            ${art.image ? `<img src="${art.image}" alt="${art.title}">` : ''}
            <div class="actu-body">
              <h3>${art.title}</h3>
              <p>${art.content}</p>
              <div class="actu-date">Publié le ${new Date(art.date).toLocaleDateString('fr-FR')}</div>
              <button class="btn-delete" onclick="deleteArticle(${art.id})">Supprimer</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error('Erreur lors du chargement des articles:', err);
      }
    }

    // Soumission du formulaire
    actuForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData();
      formData.append('title', document.getElementById('title').value);
      formData.append('content', document.getElementById('content').value);
      
      const imageFile = document.getElementById('image').files[0];
      if (imageFile) {
        formData.append('image', imageFile);
      }

      await fetch('/api/actu', {
        method: 'POST',
        body: formData
      });

      actuForm.reset();
      loadArticles();
    });

    // Supprimer un article
    async function deleteArticle(id) {
      if (confirm('Voulez-vous vraiment supprimer cet article ?')) {
        await fetch(`/api/actu/${id}`, { method: 'DELETE' });
        loadArticles();
      }
    }

    loadArticles();
  </script>
</body>
</html>
