<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accueil & Actualités</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    /* Fond d'écran avec tes 2 images locales (accueil et accueil 2) */
    body {
      background-image: url('accueil.jpg'), url('accueil2.jpg');
      background-position: top center, bottom center;
      background-repeat: no-repeat, no-repeat;
      background-size: cover, cover;
      background-attachment: fixed;
      color: #333;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.92);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #ddd;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    nav button {
      padding: 8px 16px;
      margin-right: 5px;
      cursor: pointer;
      border: none;
      background: #e0e0e0;
      border-radius: 4px;
      font-weight: bold;
    }

    nav button.active {
      background: #007bff;
      color: white;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .btn {
      padding: 10px 20px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-danger {
      background: #dc3545;
    }

    #login-form {
      max-width: 400px;
      margin: 40px auto;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 6px;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Mon Site</h1>
      <!-- L'onglet Admin est totalement masqué ici -->
      <nav>
        <button class="nav-btn active" onclick="showSection('accueil')">Accueil</button>
        <button class="nav-btn" onclick="showSection('actus')">Actualités</button>
      </nav>
    </header>

    <!-- SECTION ACCUEIL -->
    <main id="accueil" class="section active">
      <h2>Bienvenue</h2>
      <p>Contenu de la page d'accueil.</p>
    </main>

    <!-- SECTION ACTUALITÉS -->
    <main id="actus" class="section">
      <h2>Dernières Actualités</h2>
      <div id="news-list">
        <p>Aucune actualité pour le moment.</p>
      </div>
    </main>

    <!-- SECTION ADMIN (ACCESSIBLE UNIQUEMENT VIA #admin DANS L'URL) -->
    <main id="admin" class="section">
      <!-- FORMULAIRE DE CONNEXION -->
      <div id="login-form">
        <h3>Connexion Administrateur</h3>
        <br>
        <div class="form-group">
          <label for="admin-pass">Mot de passe requi :</label>
          <input type="password" id="admin-pass" placeholder="Entrez le mot de passe">
        </div>
        <button class="btn" onclick="checkPassword()">Se connecter</button>
        <p id="login-error" style="color: red; margin-top: 10px; display: none;">Mot de passe incorrect.</p>
      </div>

      <!-- PANEL ADMIN (MASQUÉ TANT QUE NON AUTHENTIFIÉ) -->
      <div id="admin-panel" style="display: none;">
        <h2>Espace Administration</h2>
        <br>
        <div class="form-group">
          <h3>Ajouter une actualité</h3>
          <br>
          <label for="news-title">Titre :</label>
          <input type="text" id="news-title">
        </div>
        <div class="form-group">
          <label for="news-content">Contenu :</label>
          <textarea id="news-content" rows="4"></textarea>
        </div>
        <button class="btn" onclick="addNews()">Publier</button>
        <button class="btn btn-danger" onclick="logoutAdmin()" style="margin-left: 10px;">Déconnexion</button>
      </div>
    </main>
  </div>

  <script>
    // Mot de passe d'accès admin
    const ADMIN_PASSWORD = "MonSuperPass123!";

    function showSection(sectionId) {
      document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

      const targetSection = document.getElementById(sectionId);
      if (targetSection) {
        targetSection.classList.add('active');
      }

      // Gestion du bouton actif dans le menu
      if (sectionId === 'accueil') document.querySelectorAll('.nav-btn')[0].classList.add('active');
      if (sectionId === 'actus') document.querySelectorAll('.nav-btn')[1].classList.add('active');
    }

    // Détection de l'URL pour la navigation cachée (#admin)
    function checkHash() {
      if (window.location.hash === '#admin') {
        showSection('admin');
      }
    }

    window.addEventListener('hashchange', checkHash);
    window.addEventListener('load', checkHash);

    // Vérification du mot de passe
    function checkPassword() {
      const inputPass = document.getElementById('admin-pass').value;
      const errorMsg = document.getElementById('login-error');

      if (inputPass === ADMIN_PASSWORD) {
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
        document.getElementById('admin-pass').value = '';
        errorMsg.style.display = 'none';
      } else {
        errorMsg.style.display = 'block';
      }
    }

    function logoutAdmin() {
      document.getElementById('login-form').style.display = 'block';
      document.getElementById('admin-panel').style.display = 'none';
      window.location.hash = '';
      showSection('accueil');
    }

    function addNews() {
      const title = document.getElementById('news-title').value;
      const content = document.getElementById('news-content').value;

      if (!title || !content) {
        alert('Veuillez remplir tous les champs.');
        return;
      }

      const newsList = document.getElementById('news-list');
      if (newsList.querySelector('p')) {
        newsList.innerHTML = '';
      }

      const article = document.createElement('article');
      article.style.marginBottom = '15px';
      article.innerHTML = `<h3>${title}</h3><p>${content}</p><hr style="margin-top:10px;">`;
      newsList.prepend(article);

      document.getElementById('news-title').value = '';
      document.getElementById('news-content').value = '';
      alert('Actualité ajoutée !');
    }
  </script>
</body>
</html>
    loadArticles();
  </script>
</body>
</html>
