<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ValTrackPlayer - Site Officiel</title>
  <style>
    * { box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: url('bg.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #2c3e50;
    }

    .banner-container {
      width: 100%;
      height: 250px;
      background: url('banner.jpg') no-repeat center center;
      background-size: cover;
      border-bottom: 4px solid #c0392b;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      position: relative;
    }

    .banner-overlay {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
      padding: 15px 0;
      text-align: center;
    }

    .banner-overlay h1 {
      margin: 0;
      font-size: 2.2em;
      color: #ffffff;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
      letter-spacing: 1px;
    }

    .container {
      max-width: 950px;
      margin: 30px auto;
      padding: 0 20px;
      flex: 1;
      width: 100%;
    }

    section {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(4px);
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 30px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
    }

    h2 {
      margin-top: 0;
      border-bottom: 3px solid #c0392b;
      padding-bottom: 8px;
      color: #2c3e50;
      font-size: 1.5em;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    
    .tab-btn {
      background: #e0e0e0;
      border: 1px solid #ccc;
      color: #333;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    
    .tab-btn:hover, .tab-btn.active {
      background: #c0392b;
      color: white;
      border-color: #c0392b;
    }

    .card {
      background: #ffffff;
      border-left: 5px solid #27ae60;
      padding: 15px 20px;
      margin-bottom: 15px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    
    .card h3 { margin: 0 0 8px 0; color: #27ae60; }
    .card p { margin: 0; line-height: 1.5; color: #444; }

    .vinted-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 15px 20px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #eee;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    
    .vinted-btn {
      background: #00a8ff;
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
      transition: background 0.2s;
    }
    
    .vinted-btn:hover { background: #0097e6; }

    footer {
      background: #1e1e1e;
      color: white;
      text-align: center;
      padding: 30px 20px;
      margin-top: auto;
    }
    
    footer p { margin-top: 0; color: #bbb; font-size: 0.95em; }
    
    .socials {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 15px;
    }
    
    .btn-social {
      padding: 10px 22px;
      text-decoration: none;
      color: white;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95em;
      transition: transform 0.2s, opacity 0.2s;
    }
    
    .btn-social:hover { 
      transform: translateY(-3px); 
      opacity: 0.9;
    }
    
    .twitch { background-color: #9146FF; }
    .discord { background-color: #5865F2; }
    .youtube { background-color: #FF0000; }
  </style>
</head>
<body>

  <div class="banner-container">
    <div class="banner-overlay">
      <h1>ValTrackPlayer</h1>
    </div>
  </div>

  <div class="container">
    <section>
      <h2>Actualités</h2>
      <div class="tabs" id="tabs-container"></div>
      <div id="actu-container">Chargement des actualités...</div>
    </section>

    <section>
      <h2>Mes Annonces Vinted</h2>
      <div id="vinted-container">Chargement des articles...</div>
    </section>
  </div>

  <footer>
    <p>Pour nous suivre au quotidien, ne rien rater des lives et échanger avec la communauté :</p>
    <div class="socials">
      <a href="https://www.twitch.tv/valtrackplayer" target="_blank" class="btn-social twitch">Twitch</a>
      <a href="https://discord.gg/Zb2DX9GNJ" target="_blank" class="btn-social discord">Serveur Discord</a>
      <a href="https://www.youtube.com/@ValTrackPlayer" target="_blank" class="btn-social youtube">Chaîne YouTube</a>
    </div>
  </footer>

  <script>
    async function initialiser() {
      await chargerOnglets();
      await chargerVinted();
    }

    async function chargerOnglets() {
      const res = await fetch('/api/categories');
      const cats = await res.json();
      const tabsDiv = document.getElementById('tabs-container');
      
      tabsDiv.innerHTML = `<button class="tab-btn active" onclick="filtrerActu(null, this)">Toutes</button>`;
      
      cats.forEach(c => {
        tabsDiv.innerHTML += `<button class="tab-btn" onclick="filtrerActu(${c.id}, this)">${c.nom}</button>`;
      });

      chargerActu(null);
    }

    async function filtrerActu(catId, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      chargerActu(catId);
    }

    async function chargerActu(catId) {
      const url = catId ? `/api/actu?cat=${catId}` : '/api/actu';
      const res = await fetch(url);
      const actus = await res.json();
      const div = document.getElementById('actu-container');

      if (actus.length === 0) {
        div.innerHTML = '<p style="color:#777;">Aucune actualité dans cette catégorie pour le moment.</p>';
        return;
      }

      div.innerHTML = '';
      actus.forEach(a => {
        div.innerHTML += `
          <div class="card">
            <h3>${a.titre} <small style="font-size:0.75em; color:#888; font-weight:normal;">(${a.date})</small></h3>
            <p>${a.contenu}</p>
          </div>
        `;
      });
    }

    async function chargerVinted() {
      const res = await fetch('/api/vinted');
      const articles = await res.json();
      const div = document.getElementById('vinted-container');

      if (articles.length === 0) {
        div.innerHTML = '<p style="color:#777;">Aucune annonce Vinted en cours.</p>';
        return;
      }

      div.innerHTML = '';
      articles.forEach(v => {
        div.innerHTML += `
          <div class="vinted-card">
            <div>
              <strong>${v.titre}</strong> - <span style="color:#27ae60; font-weight:bold;">${v.prix} €</span>
            </div>
            <a href="${v.lien}" target="_blank" class="vinted-btn">Voir sur Vinted</a>
          </div>
        `;
      });
    }

    initialiser();
  </script>
</body>
</html>
