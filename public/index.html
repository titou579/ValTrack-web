<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accueil - Actualités</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; color: #333; line-height: 1.6; }
    header { background: #1e293b; color: white; padding: 1.5rem; text-align: center; }
    main { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    
    .filters { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 2rem; justify-content: center; }
    .filter-btn { background: #e2e8f0; border: none; padding: 0.5rem 1.2rem; border-radius: 20px; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .filter-btn.active, .filter-btn:hover { background: #2563eb; color: white; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
    .actu-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
    .actu-card img { width: 100%; height: 200px; object-fit: cover; }
    .actu-content { padding: 1.2rem; flex: 1; display: flex; flex-direction: column; }
    .badge { background: #e0e7ff; color: #4338ca; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.8rem; font-weight: bold; width: fit-content; margin-bottom: 0.5rem; }
    .actu-content h3 { font-size: 1.2rem; margin-bottom: 0.5rem; }
    .actu-content p { color: #64748b; font-size: 0.95rem; flex: 1; white-space: pre-line; }
    .actu-content small { color: #94a3b8; font-size: 0.8rem; margin-top: 1rem; }
    .empty-msg { text-align: center; color: #64748b; width: 100%; grid-column: 1 / -1; padding: 2rem; }
  </style>
</head>
<body>

  <header>
    <h1>Actualités & Publication</h1>
  </header>

  <main>
    <!-- Filtres des rubriques -->
    <div id="categories-filter" class="filters"></div>

    <!-- Grille des articles -->
    <div id="actu-container" class="grid"></div>
  </main>

  <script>
    let categorieActive = 'all';

    document.addEventListener('DOMContentLoaded', () => {
      chargerCategories();
      chargerActus();
    });

    async function chargerCategories() {
      try {
        const res = await fetch('/api/categories?t=' + Date.now());
        const categories = await res.json();
        const container = document.getElementById('categories-filter');
        if (!container) return;

        let html = `<button class="filter-btn ${categorieActive === 'all' ? 'active' : ''}" onclick="filtrerCategorie('all')">Toutes</button>`;

        categories.forEach(cat => {
          html += `
            <button class="filter-btn ${categorieActive == cat.id ? 'active' : ''}" onclick="filtrerCategorie(${cat.id})">
              ${cat.nom}
            </button>
          `;
        });

        container.innerHTML = html;
      } catch (err) {
        console.error("Erreur chargement catégories:", err);
      }
    }

    async function chargerActus() {
      try {
        const res = await fetch('/api/actu?t=' + Date.now());
        const actus = await res.json();
        const container = document.getElementById('actu-container');
        if (!container) return;

        const actusFiltrees = categorieActive === 'all' 
          ? actus 
          : actus.filter(a => a.category_id == categorieActive);

        if (actusFiltrees.length === 0) {
          container.innerHTML = '<p class="empty-msg">Aucune actualité dans cette rubrique.</p>';
          return;
        }

        container.innerHTML = actusFiltrees.map(item => `
          <div class="actu-card">
            ${item.image ? `<img src="${item.image}" alt="${item.titre}">` : ''}
            <div class="actu-content">
              <span class="badge">${item.category_name || 'Général'}</span>
              <h3>${item.titre}</h3>
              <p>${item.contenu}</p>
              <small>${new Date(item.date).toLocaleDateString('fr-FR')}</small>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error("Erreur chargement actu:", err);
      }
    }

    function filtrerCategorie(id) {
      categorieActive = id;
      chargerCategories();
      chargerActus();
    }
  </script>
</body>
</html>
