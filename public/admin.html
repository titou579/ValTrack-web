<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Daily Scoop - Panel Admin</title>
  <style>
    :root {
      --bg-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1920&auto=format&fit=crop');
      --card-bg: rgba(20, 20, 30, 0.65);
      --card-border: rgba(255, 255, 255, 0.18);
      --text-color: #ffffff;
      --subtext-color: #e0e0e0;
      --accent-color: #7289da;
      --glass-blur: blur(16px);
    }

    body.light-theme {
      --card-bg: rgba(255, 255, 255, 0.75);
      --card-border: rgba(0, 0, 0, 0.1);
      --text-color: #1a1a1a;
      --subtext-color: #4a4a4a;
    }

    body.opaque-mode {
      --glass-blur: blur(0px);
      --card-bg: #1e1f29;
    }

    body.light-theme.opaque-mode {
      --card-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.3s, color 0.3s; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-image) no-repeat center center fixed;
      background-size: cover;
      color: var(--text-color);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* En-tête Google Onglet */
    .chrome-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(10, 10, 15, 0.8);
      backdrop-filter: blur(10px);
      padding: 10px 20px;
      border-bottom: 1px solid var(--card-border);
    }

    .tabs-container { display: flex; gap: 8px; }

    .google-tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px 12px 0 0;
      color: #fff;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .google-tab.active {
      background: var(--card-bg);
      backdrop-filter: var(--glass-blur);
      border-color: var(--card-border);
      color: var(--text-color);
    }

    .social-links { display: flex; gap: 12px; }

    .social-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }

    .social-btn.discord { background: #5865F2; }
    .social-btn.youtube { background: #FF0000; }
    .social-btn.twitch { background: #9146FF; }

    /* Réglages d'apparence */
    .controls-bar {
      max-width: 800px;
      margin: 20px auto 10px;
      padding: 12px 20px;
      background: var(--card-bg);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .control-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid var(--card-border);
      color: var(--text-color);
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 0 15px;
    }

    /* Formulaire d'envoi */
    .admin-card {
      background: var(--card-bg);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .admin-card h2 { margin-bottom: 20px; }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 600; }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-color);
    }
    .form-group textarea { height: 120px; resize: vertical; }

    .btn-submit {
      background: #28a745;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    /* Liste de gestion des articles */
    .admin-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .btn-delete {
      background: #dc3545;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header class="chrome-bar">
    <nav class="tabs-container">
      <a href="/" class="google-tab">🌐 Accueil</a>
      <a href="/admin" class="google-tab active">⚙️ Administration</a>
    </nav>
    <div class="social-links">
      <a href="https://discord.gg" target="_blank" class="social-btn discord">DC</a>
      <a href="https://youtube.com" target="_blank" class="social-btn youtube">YT</a>
      <a href="https://twitch.tv" target="_blank" class="social-btn twitch">TW</a>
    </div>
  </header>

  <div class="controls-bar">
    <span>🎨 <strong>Apparence Admin</strong></span>
    <div>
      <button class="control-btn" id="themeToggle">Sombre / Clair</button>
      <button class="control-btn" id="glassToggle">Liquid Glass / Opaque</button>
    </div>
  </div>

  <div class="container">
    <div class="admin-card">
      <h2>Publier une Nouvelle Actualité</h2>
      <form id="addForm">
        <div class="form-group">
          <label for="title">Titre de l'article</label>
          <input type="text" id="title" required placeholder="Titre explicite...">
        </div>
        <div class="form-group">
          <label for="content">Contenu</label>
          <textarea id="content" required placeholder="Rédigez le texte de l'article..."></textarea>
        </div>
        <div class="form-group">
          <label for="image">Illustration (Optionnel)</label>
          <input type="file" id="image" accept="image/*">
        </div>
        <button type="submit" class="btn-submit">🚀 Publier l'article</button>
      </form>
    </div>

    <div class="admin-card">
      <h2>Gérer les Articles Existant</h2>
      <div id="adminArticlesList"></div>
    </div>
  </div>

  <script>
    // Thème & Effets
    const themeToggle = document.getElementById('themeToggle');
    const glassToggle = document.getElementById('glassToggle');

    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('light-theme');
      localStorage.setItem('theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
    });

    glassToggle.addEventListener('click', () => {
      document.body.classList.toggle('opaque-mode');
      localStorage.setItem('glass', document.body.classList.contains('opaque-mode') ? 'opaque' : 'glass');
    });

    if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-theme');
    if (localStorage.getItem('glass') === 'opaque') document.body.classList.add('opaque-mode');

    // Charger la liste admin
    async function loadAdminList() {
      const list = document.getElementById('adminArticlesList');
      try {
        const res = await fetch('/api/actu');
        const articles = await res.json();

        if (articles.length === 0) {
          list.innerHTML = '<p>Aucun article enregistré.</p>';
          return;
        }

        list.innerHTML = articles.map(art => `
          <div class="admin-item">
            <div>
              <strong>${art.title}</strong>
              <div style="font-size: 0.8rem; opacity: 0.7;">${new Date(art.date).toLocaleDateString('fr-FR')}</div>
            </div>
            <button class="btn-delete" onclick="deleteArticle(${art.id})">Supprimer</button>
          </div>
        `).join('');
      } catch (err) {
        list.innerHTML = '<p style="color: #ff6b6b;">Erreur lors de la récupération des données.</p>';
      }
    }

    // Ajouter un article
    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData();
      formData.append('title', document.getElementById('title').value);
      formData.append('content', document.getElementById('content').value);
      
      const fileInput = document.getElementById('image');
      if (fileInput.files[0]) {
        formData.append('image', fileInput.files[0]);
      }

      await fetch('/api/actu', { method: 'POST', body: formData });
      document.getElementById('addForm').reset();
      loadAdminList();
    });

    // Supprimer un article
    async function deleteArticle(id) {
      if (confirm('Voulez-vous supprimer cet article ?')) {
        await fetch(`/api/actu/${id}`, { method: 'DELETE' });
        loadAdminList();
      }
    }

    loadAdminList();
  </script>
</body>
</html>
